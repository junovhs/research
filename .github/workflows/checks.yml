name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks
  cancel-in-progress: false

jobs:
  # This name satisfies the existing main-branch protection rule.
  # The implementation validates only the new project's files and configuration.
  evidence-and-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-11-06
        with:
          persist-credentials: false
      - name: Validate the new project
        run: python3 tools/check_project.py
      - name: Compile-check project utilities
        run: python3 -m compileall -q tools
