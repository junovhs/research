name: Bounded needle dig
on:
  workflow_dispatch:
    inputs:
      needle:
        description: Open field to dig (confirmation is sealed)
        type: choice
        options: [calibration, exploration]
        default: calibration
permissions:
  contents: read
concurrency:
  group: needle-research
  cancel-in-progress: false
jobs:
  dig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set external cache directory
        run: echo "NEEDLE_CACHE=$RUNNER_TEMP/needle-cache" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_project.py
      - name: Dig Gaia and AllWISE from a cold cache
        env:
          NEEDLE: ${{ inputs.needle }}
          PYTHONHASHSEED: '1'
        run: python tools/layers.py --needle "$NEEDLE" --output data/full-dig.json
      - name: Verify offline replay
        env:
          NEEDLE: ${{ inputs.needle }}
          PYTHONHASHSEED: '2'
        run: python tools/layers.py --needle "$NEEDLE" --offline --output data/replay.json
      - name: Compare replayed evidence
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data/full-dig.json'))['fields']
          b=json.load(open('data/replay.json'))['fields']
          assert set(a)==set(b)
          for role in a:
              for key in ('gaia_manifest','allwise_manifest','reference_manifest'):
                  assert a[role][key]['sha256']==b[role][key]['sha256']
              for key in ('crossmatch','published_calibration','infrared_followup'):
                  assert a[role][key]==b[role][key]
          print('Offline replay input hashes and matching/follow-up results agree')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: needle-${{ inputs.needle }}-${{ github.run_id }}
          path: |
            data/
            ${{ runner.temp }}/needle-cache/
          retention-days: 7
